<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heather's Recipe Box</title>
<meta name="description" content="Our family recipes, all in one tidy place.">
<meta name="theme-color" content="#faf5ec">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #faf5ec;
    --paper: #fffdf8;
    --ink: #2f2622;
    --muted: #7a6a5f;
    --line: #eadfce;
    --accent: #b4532a;
    --accent-ink: #8f3f1d;
    --accent-soft: #f6e4d6;
    --sage: #5f7d5a;
    --sage-soft: #e6eee1;
    --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 6px 18px rgba(60, 40, 20, .07);
    --radius: 16px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-ink); }
  img { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* ---------- header ---------- */
  .site-header { padding: 28px 0 8px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; width: fit-content; }
  .brand svg { flex: none; }
  .brand h1 { margin: 0; font: 600 30px/1.1 var(--serif); letter-spacing: -.01em; }
  .tagline { margin: 6px 0 0 52px; color: var(--muted); font-size: 15px; }

  /* ---------- list view ---------- */
  .toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 14px 0 10px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; padding: 13px 44px 13px 44px; font: inherit; font-size: 17px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink);
    box-shadow: var(--shadow); -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: #a5968a; }
  .search input::-webkit-search-cancel-button { display: none; }
  .clear-search { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none;
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; color: var(--muted); display: none; }
  .clear-search.show { display: grid; place-items: center; }
  .tags { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
  .tags::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 999px;
    padding: 6px 14px; font-size: 14px; cursor: pointer; white-space: nowrap; text-transform: capitalize;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 14px; margin: 8px 0 14px; min-height: 1.4em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding-bottom: 40px; }
  .card {
    display: flex; flex-direction: column; text-decoration: none; color: inherit; background: var(--paper);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(60,40,20,.08), 0 12px 28px rgba(60,40,20,.12); }
  .card .photo { aspect-ratio: 4 / 3; background: var(--accent-soft); overflow: hidden; }
  .card .photo img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h2 { margin: 0; font: 600 20px/1.25 var(--serif); }
  .card .meta { display: flex; gap: 14px; color: var(--muted); font-size: 14px; margin-top: auto; padding-top: 4px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: var(--accent);
    background: radial-gradient(circle at 30% 20%, #fbeee3, var(--accent-soft)); }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; grid-column: 1 / -1; }
  .empty strong { display: block; font: 600 22px var(--serif); color: var(--ink); margin-bottom: 6px; }

  /* ---------- recipe view ---------- */
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 10px 0 14px; text-decoration: none;
    color: var(--accent-ink); font-weight: 600; font-size: 15px; padding: 6px 0; }
  .recipe-head { display: grid; gap: 22px; grid-template-columns: 1fr; align-items: start; }
  .hero { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); aspect-ratio: 4 / 3; background: var(--accent-soft); }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .recipe-title { margin: 0; font: 600 34px/1.12 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
  .desc { margin: 10px 0 0; color: #54463d; font-size: 17px; }
  .source { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
  .facts li { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .facts .k { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .facts .v { display: block; font-weight: 600; font-size: 16px; margin-top: 2px; }
  .recipe-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .recipe-tags a { font-size: 13px; text-decoration: none; background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 999px; padding: 3px 11px; text-transform: capitalize; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--paper);
    border-radius: 999px; padding: 9px 16px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
  .btn[aria-pressed="true"] { background: var(--sage); border-color: var(--sage); color: #fff; }
  .btn[hidden] { display: none; }

  .recipe-body { display: grid; gap: 28px; grid-template-columns: 1fr; margin: 30px 0 48px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 20px 22px; box-shadow: var(--shadow); }
  .panel h2 { margin: 0 0 12px; font: 600 23px var(--serif); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .panel h2 small { font: 500 13px var(--sans); color: var(--muted); }
  .link-btn { border: 0; background: none; color: var(--accent-ink); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 0; }
  .section-title { margin: 18px 0 6px; font: 600 15px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); }
  .section-title:first-child { margin-top: 0; }

  .ingredients { list-style: none; margin: 0; padding: 0; }
  .ingredients li + li { border-top: 1px dashed var(--line); }
  .ingredients label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 2px; cursor: pointer; }
  .ingredients input { appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; margin: 2px 0 0;
    border: 2px solid #cdbba9; border-radius: 6px; background: #fff; display: grid; place-items: center; cursor: pointer; }
  .ingredients input:checked { background: var(--sage); border-color: var(--sage); }
  .ingredients input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .ingredients input:checked + span { color: #9b8d82; text-decoration: line-through; text-decoration-color: #c9bcb0; }

  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps li.step { counter-increment: step; position: relative; padding: 12px 10px 12px 52px; border-radius: 12px; cursor: pointer;
    transition: background .15s ease; }
  .steps li.step::before { content: counter(step); position: absolute; left: 8px; top: 11px; width: 32px; height: 32px;
    border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font: 700 15px/32px var(--sans); text-align: center; }
  .steps li.step.done { color: #9b8d82; }
  .steps li.step.done::before { background: var(--sage-soft); color: var(--sage); content: "✓"; }
  .steps li.step.current { background: #fff6ec; box-shadow: inset 3px 0 0 var(--accent); }
  .steps .section-title { list-style: none; padding-left: 8px; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

  .notes { white-space: pre-wrap; margin: 0; }
  .site-footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--muted); font-size: 14px; text-align: center; }
  .site-footer a { font-weight: 600; }
  .loading { padding: 80px 0; text-align: center; color: var(--muted); }

  @media (min-width: 760px) {
    .site-header { padding-top: 40px; }
    .brand h1 { font-size: 36px; }
    .recipe-title { font-size: 44px; }
    .recipe-head { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 36px; }
    .recipe-head.no-photo { grid-template-columns: 1fr; max-width: 760px; }
    .recipe-body { grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.4fr); align-items: start; }
    .recipe-body .ing-panel { position: sticky; top: 16px; }
    .recipe-body .notes-panel { grid-column: 2; }
    .panel { padding: 24px 26px 26px; }
  }
  @media (max-width: 420px) {
    .wrap { padding: 0 16px; }
    .brand h1 { font-size: 26px; }
    .tagline { margin-left: 50px; font-size: 14px; }
    .grid { grid-template-columns: 1fr; gap: 16px; }
    .recipe-title { font-size: 30px; }
    .facts { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media print {
    @page { margin: 0.6in; }
    * { transition: none !important; }
    body { background: #fff; color: #000; font-size: 11pt; line-height: 1.4; }
    .site-header, .toolbar, .back, .actions, .site-footer, .hero, .recipe-tags, .hint, .link-btn { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    .recipe-head, .recipe-head.no-photo { display: block; }
    .recipe-title { font-size: 24pt; }
    .desc { color: #222; }
    .source a { color: #000; text-decoration: none; }
    .source a::after { content: " (" attr(href) ")"; font-size: 9pt; color: #444; word-break: break-all; }
    .facts { display: flex; gap: 18px; margin-top: 10px; }
    .facts li { border: 0; padding: 0; background: none; }
    .recipe-body { display: grid; grid-template-columns: 2.3in 1fr; gap: 0.35in; margin-top: 18px; }
    .recipe-body .notes-panel { grid-column: 1 / -1; }
    .panel { box-shadow: none; border: 0; padding: 0; background: none; }
    .panel h2 { font-size: 15pt; border-bottom: 1px solid #000; padding-bottom: 3px; }
    .ingredients li + li { border-top: 0; }
    .ingredients label { padding: 3px 0; }
    .ingredients input { width: 12px; height: 12px; border: 1px solid #000 !important; border-radius: 2px; margin-top: 3px; background: #fff !important; }
    .ingredients input::after { display: none; }
    .ingredients input:checked + span { color: #000; text-decoration: none; }
    .steps li.step { padding: 4px 0 6px 30px; break-inside: avoid; background: none !important; box-shadow: none !important; color: #000 !important; }
    .steps li.step::before, .steps li.step.done::before { content: counter(step) "."; background: none; color: #000; width: auto; height: auto; top: 4px; left: 0; font: 700 11pt var(--sans); }
    .section-title { color: #000; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="Heather's Recipe Box, all recipes">
      <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="16" width="56" height="40" rx="8" fill="#b4532a"/><path d="M4 26h56" stroke="#8f3f1d" stroke-width="3"/><rect x="14" y="6" width="36" height="22" rx="4" fill="#fffdf8" stroke="#eadfce" stroke-width="2"/><path d="M20 13h24M20 19h16" stroke="#cdbba9" stroke-width="2.5" stroke-linecap="round"/><path d="M32 46c-5-3-9-6-9-10a4.5 4.5 0 0 1 9-1.5A4.5 4.5 0 0 1 41 36c0 4-4 7-9 10z" fill="#fffdf8"/></svg>
      <h1>Heather's Recipe Box</h1>
    </a>
    <p class="tagline">Our family recipes, all in one tidy place.</p>
  </div>
</header>

<main id="app" class="wrap"><p class="loading">Opening the recipe box…</p></main>

<footer class="site-footer">
  <div class="wrap">
    Want to save a new one? <a href="https://docs.google.com/forms/d/e/1FAIpQLSeDqux4RSuLJjeHEYwAQh0f1tM6EgGlyRR-nRMEVmthjfPkNQ/viewform" target="_blank" rel="noopener">Add a recipe</a>
  </div>
</footer>

<script>
(() => {
  const app = document.getElementById("app");
  const SECTION = "## ";
  const state = { index: null, query: "", tags: new Set(), listScroll: 0, cache: new Map() };
  let wakeLock = null;
  let wantWake = false;

  const icons = {
    clock: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    serves: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>',
    search: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    print: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>',
    sun: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    bowl: '<svg width="56" height="56" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M8 30h48c0 13-10.7 22-24 22S8 43 8 30z"/><path d="M24 22c0-4 4-4 4-8M34 22c0-4 4-4 4-8"/></svg>',
  };

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function fmtMinutes(m) {
    if (!m) return "";
    const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), min = m % 60;
    const parts = [];
    if (d) parts.push(`${d} day${d > 1 ? "s" : ""}`);
    if (h) parts.push(`${h} hr`);
    if (min) parts.push(`${min} min`);
    return parts.join(" ");
  }
  const servesLabel = (s) => (s || "").replace(/\s*servings?$/i, "");

  async function getJSON(path) {
    const res = await fetch(path, { cache: "no-cache" });
    if (!res.ok) throw new Error(`${path}: ${res.status}`);
    return res.json();
  }

  async function loadIndex() {
    if (!state.index) state.index = (await getJSON("recipes/index.json")).recipes || [];
    return state.index;
  }

  // ---------------------------------------------------------------- list view
  function allTags(recipes) {
    const counts = new Map();
    recipes.forEach((r) => (r.tags || []).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
    return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([t]) => t);
  }

  function matches(r) {
    for (const t of state.tags) if (!(r.tags || []).includes(t)) return false;
    const q = state.query.trim().toLowerCase();
    if (!q) return true;
    const hay = `${r.search || ""} ${(r.description || "").toLowerCase()}`;
    return q.split(/\s+/).every((w) => hay.includes(w));
  }

  function cardHTML(r) {
    const photo = r.image
      ? `<img src="${esc(r.image)}" alt="" loading="lazy" decoding="async">`
      : `<div class="placeholder">${icons.bowl}</div>`;
    const time = r.total_minutes ? `<span>${icons.clock}${esc(fmtMinutes(r.total_minutes))}</span>` : "";
    const serves = r.servings ? `<span>${icons.serves}${esc(servesLabel(r.servings))}</span>` : "";
    return `<a class="card" href="#/recipe/${encodeURIComponent(r.slug)}">
      <div class="photo">${photo}</div>
      <div class="body"><h2>${esc(r.title)}</h2><div class="meta">${time}${serves}</div></div>
    </a>`;
  }

  function renderGrid() {
    const recipes = state.index.filter(matches);
    const grid = app.querySelector(".grid");
    const count = app.querySelector(".count");
    const total = state.index.length;
    count.textContent = recipes.length === total
      ? `${total} recipe${total === 1 ? "" : "s"}`
      : `${recipes.length} of ${total} recipes`;
    grid.innerHTML = recipes.length
      ? recipes.map(cardHTML).join("")
      : total
        ? `<div class="empty"><strong>Nothing matches yet</strong>Try a different word or clear the filters.</div>`
        : `<div class="empty"><strong>The recipe box is empty</strong>Add the first recipe from the link below.</div>`;
    app.querySelectorAll(".chip").forEach((c) => {
      const tag = c.dataset.tag;
      c.setAttribute("aria-pressed", tag ? String(state.tags.has(tag)) : String(state.tags.size === 0));
    });
    app.querySelector(".clear-search").classList.toggle("show", !!state.query);
  }

  async function showList() {
    releaseWake();
    document.title = "Heather's Recipe Box";
    const recipes = await loadIndex();
    const tags = allTags(recipes);
    app.innerHTML = `
      <div class="toolbar">
        <div class="search">
          ${icons.search}
          <input type="search" placeholder="Search recipes or ingredients" aria-label="Search recipes" value="${esc(state.query)}" autocomplete="off" enterkeyhint="search">
          <button class="clear-search" type="button" aria-label="Clear search">${icons.x}</button>
        </div>
        ${tags.length ? `<div class="tags" role="group" aria-label="Filter by tag">
          <button class="chip" type="button" aria-pressed="true">All</button>
          ${tags.map((t) => `<button class="chip" type="button" data-tag="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join("")}
        </div>` : ""}
      </div>
      <p class="count" aria-live="polite"></p>
      <section class="grid"></section>`;
    const input = app.querySelector("input");
    input.addEventListener("input", () => { state.query = input.value; renderGrid(); });
    app.querySelector(".clear-search").addEventListener("click", () => { state.query = ""; input.value = ""; renderGrid(); input.focus(); });
    app.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => {
      const tag = chip.dataset.tag;
      if (!tag) state.tags.clear();
      else if (state.tags.has(tag)) state.tags.delete(tag);
      else state.tags.add(tag);
      renderGrid();
    }));
    renderGrid();
    window.scrollTo(0, state.listScroll);
  }

  // ---------------------------------------------------------------- recipe view
  function storeKey(slug) { return `recipe-progress:${slug}`; }
  function loadProgress(slug) {
    try { return JSON.parse(localStorage.getItem(storeKey(slug))) || { ing: [], steps: [] }; }
    catch { return { ing: [], steps: [] }; }
  }
  function saveProgress(slug, p) {
    try { localStorage.setItem(storeKey(slug), JSON.stringify(p)); } catch { /* private mode */ }
  }

  function ingredientsHTML(list, done) {
    let html = "", open = false, i = 0;
    for (const item of list) {
      if (item.startsWith(SECTION)) {
        if (open) html += "</ul>";
        html += `<h3 class="section-title">${esc(item.slice(SECTION.length))}</h3>`;
        open = false;
        continue;
      }
      if (!open) { html += '<ul class="ingredients">'; open = true; }
      html += `<li><label><input type="checkbox" data-i="${i}" ${done.includes(i) ? "checked" : ""}><span>${esc(item)}</span></label></li>`;
      i++;
    }
    return html + (open ? "</ul>" : "");
  }

  function stepsHTML(list, done) {
    let i = 0;
    return `<ol class="steps">${list.map((s) => s.startsWith(SECTION)
      ? `<li class="section-title" role="presentation">${esc(s.slice(SECTION.length))}</li>`
      : `<li class="step${done.includes(i) ? " done" : ""}" data-i="${i++}">${esc(s)}</li>`).join("")}</ol>`;
  }

  function markCurrentStep() {
    const steps = [...app.querySelectorAll(".step")];
    steps.forEach((s) => s.classList.remove("current"));
    const next = steps.find((s) => !s.classList.contains("done"));
    if (next && steps.some((s) => s.classList.contains("done"))) next.classList.add("current");
  }

  async function showRecipe(slug) {
    const fromList = !app.querySelector(".recipe-title");
    if (fromList && app.querySelector(".grid")) state.listScroll = window.scrollY;
    let r = state.cache.get(slug);
    if (!r) {
      try { r = await getJSON(`recipes/${encodeURIComponent(slug)}.json`); }
      catch {
        app.innerHTML = `<a class="back" href="#/">${icons.back}All recipes</a><div class="empty"><strong>Recipe not found</strong>It may have been renamed or removed.</div>`;
        return;
      }
      state.cache.set(slug, r);
    }
    document.title = `${r.title} · Heather's Recipe Box`;
    const progress = loadProgress(slug);
    const facts = [
      ["Prep", fmtMinutes(r.prep_minutes)],
      ["Cook", fmtMinutes(r.cook_minutes)],
      ["Total", fmtMinutes(r.total_minutes)],
      ["Serves", servesLabel(r.servings)],
    ].filter(([, v]) => v);
    const source = r.source_url
      ? `From <a href="${esc(r.source_url)}" rel="noopener" target="_blank">${esc(r.source_name || new URL(r.source_url).hostname)}</a>${r.author ? ` · by ${esc(r.author)}` : ""}`
      : esc(r.source_name || "Family recipe") + (r.author ? ` · by ${esc(r.author)}` : "");
    const ingCount = (r.ingredients || []).filter((x) => !x.startsWith(SECTION)).length;
    const wakeSupported = "wakeLock" in navigator;

    app.innerHTML = `
      <a class="back" href="#/">${icons.back}All recipes</a>
      <article>
        <div class="recipe-head${r.image ? "" : " no-photo"}">
          ${r.image ? `<div class="hero"><img src="${esc(r.image)}" alt="${esc(r.title)}"></div>` : ""}
          <div>
            <h1 class="recipe-title">${esc(r.title)}</h1>
            ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ""}
            <p class="source">${source}</p>
            ${facts.length ? `<ul class="facts">${facts.map(([k, v]) => `<li><span class="k">${k}</span><span class="v">${esc(v)}</span></li>`).join("")}</ul>` : ""}
            ${(r.tags || []).length ? `<div class="recipe-tags">${r.tags.map((t) => `<a href="#/tag/${encodeURIComponent(t)}">${esc(t)}</a>`).join("")}</div>` : ""}
            <div class="actions">
              <button class="btn wake" type="button" aria-pressed="false" ${wakeSupported ? "" : "hidden"}>${icons.sun}<span>Keep screen on</span></button>
              <button class="btn print" type="button">${icons.print}Print</button>
            </div>
          </div>
        </div>
        <div class="recipe-body">
          <section class="panel ing-panel">
            <h2>Ingredients <small>${ingCount} item${ingCount === 1 ? "" : "s"}</small></h2>
            ${ingredientsHTML(r.ingredients || [], progress.ing)}
            <button class="link-btn reset" type="button" ${progress.ing.length || progress.steps.length ? "" : "hidden"}>Clear checkmarks</button>
          </section>
          <section class="panel">
            <h2>Steps</h2>
            ${stepsHTML(r.steps || [], progress.steps)}
            <p class="hint">Tap a step to mark it done.</p>
          </section>
          ${r.notes ? `<section class="panel notes-panel"><h2>Family notes</h2><p class="notes">${esc(r.notes)}</p></section>` : ""}
        </div>
      </article>`;
    window.scrollTo(0, 0);

    const reset = app.querySelector(".reset");
    const sync = () => {
      progress.ing = [...app.querySelectorAll(".ingredients input:checked")].map((x) => +x.dataset.i);
      progress.steps = [...app.querySelectorAll(".step.done")].map((x) => +x.dataset.i);
      saveProgress(slug, progress);
      reset.hidden = !(progress.ing.length || progress.steps.length);
      markCurrentStep();
    };
    app.querySelectorAll(".ingredients input").forEach((cb) => cb.addEventListener("change", sync));
    app.querySelectorAll(".step").forEach((li) => li.addEventListener("click", () => { li.classList.toggle("done"); sync(); }));
    reset.addEventListener("click", () => {
      app.querySelectorAll(".ingredients input").forEach((x) => { x.checked = false; });
      app.querySelectorAll(".step").forEach((x) => x.classList.remove("done"));
      sync();
    });
    app.querySelector(".print").addEventListener("click", () => window.print());
    const wakeBtn = app.querySelector(".wake");
    wakeBtn.addEventListener("click", () => (wantWake ? releaseWake() : requestWake()));
    if (wantWake) requestWake();
    markCurrentStep();
  }

  // ---------------------------------------------------------------- screen wake lock
  function setWakeUI(on, label) {
    const btn = app.querySelector(".wake");
    if (!btn) return;
    btn.setAttribute("aria-pressed", String(on));
    btn.querySelector("span").textContent = label || (on ? "Screen stays on" : "Keep screen on");
  }
  async function requestWake() {
    wantWake = true;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; if (!wantWake) setWakeUI(false); });
      setWakeUI(true);
    } catch {
      wantWake = false;
      setWakeUI(false, "Screen lock unavailable");
    }
  }
  function releaseWake() {
    wantWake = false;
    if (wakeLock) wakeLock.release().catch(() => {});
    wakeLock = null;
    setWakeUI(false);
  }
  document.addEventListener("visibilitychange", () => {
    if (wantWake && document.visibilityState === "visible" && !wakeLock && app.querySelector(".wake")) requestWake();
  });

  // ---------------------------------------------------------------- routing
  async function route() {
    const hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    try {
      if (hash.startsWith("recipe/")) return await showRecipe(hash.slice(7));
      if (hash.startsWith("tag/")) {
        state.tags = new Set([hash.slice(4)]);
        state.query = "";
        state.listScroll = 0;
        history.replaceState(null, "", "#/");
      }
      await showList();
    } catch (err) {
      console.warn(err);
      app.innerHTML = `<div class="empty"><strong>Couldn't open the recipe box</strong>Check your connection and refresh.</div>`;
    }
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
